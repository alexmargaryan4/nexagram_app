name: nexagram
description: "NexaGram — a premium, cross-platform messenger built with Flutter and Supabase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ---------- Backend: Supabase (Auth, Postgres + Realtime, Storage) ----------
  supabase_flutter: ^2.6.0

  # ---------- State management ----------
  provider: ^6.1.2

  # ---------- Routing ----------
  go_router: ^13.2.4

  # ---------- UI / Design ----------
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_staggered_animations: ^1.1.1
  blur: ^4.0.0
  animations: ^2.0.11
  flutter_slidable: ^3.1.0
  photo_view: ^0.15.0
  visibility_detector: ^0.4.0+2

  # ---------- Media / Files ----------
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  path: ^1.9.0
  mime: ^1.0.5
  video_player: ^2.8.6
  record: ^6.0.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1

  # ---------- Utils ----------
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.1.2
  shared_preferences: ^2.2.3
  timeago: ^3.7.0
  logger: ^2.3.0
  rxdart: ^0.27.7
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.ttf
        - asset: assets/fonts/SFProDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProDisplay-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFProDisplay-Bold.ttf
          weight: 700
