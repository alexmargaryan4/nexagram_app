name: Build APK & unsigned IPA

# Runs on every push to main, and can also be triggered manually from the
# GitHub app (Actions tab -> this workflow -> "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  # The Flutter project (pubspec.yaml etc.) lives in a subfolder of the
  # repo, not at the repo root — every `run:` step below needs to execute
  # from here, set via `defaults.run.working-directory` on each job.
  PROJECT_DIR: nexagram

jobs:
  # ---------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Java (needed for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      # The app_links plugin (pulled in transitively by supabase_flutter
      # for OAuth deep links) is stuck on version 6.4.1 — every newer
      # release needs a Dart SDK higher than the one Flutter 3.24.5
      # ships, so it can't just be bumped in pubspec.yaml. Version
      # 6.4.1's own android/build.gradle reads compileSdk/minSdk/
      # targetSdk off a `project.android.flutter.*` property that
      # doesn't exist on AGP 8.7.3 (this project's AGP version), which
      # is what throws "Could not get unknown property 'flutter' for
      # extension 'android'". Rather than guess at that file's exact
      # existing syntax and risk a patch that silently doesn't match,
      # we replace it outright with a minimal, self-contained
      # build.gradle that hardcodes the SDK numbers — this is the
      # commonly-used workaround for plugins whose Gradle files lag
      # behind the AGP version. The Java package (com.llfbandit.app_links)
      # is read from the plugin's own AndroidManifest.xml so the
      # namespace always matches what's actually there.
      - name: Patch app_links 6.4.1 build.gradle for AGP 8.7.3
        run: |
          PKG_DIR="$HOME/.pub-cache/hosted/pub.dev/app_links-6.4.1/android"
          GRADLE_FILE="$PKG_DIR/build.gradle"
          MANIFEST_FILE="$PKG_DIR/src/main/AndroidManifest.xml"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "app_links-6.4.1 not found in pub cache (version changed?) — skipping patch."
            exit 0
          fi

          echo "Original $GRADLE_FILE:"
          cat "$GRADLE_FILE"

          NAMESPACE="com.llfbandit.app_links"
          if [ -f "$MANIFEST_FILE" ]; then
            FOUND=$(grep -o 'package="[^"]*"' "$MANIFEST_FILE" | head -1 | sed -e 's/package="//' -e 's/"$//')
            if [ -n "$FOUND" ]; then
              NAMESPACE="$FOUND"
            fi
          fi
          echo "Using namespace: $NAMESPACE"

          cat > "$GRADLE_FILE" <<GRADLEEOF
          group 'com.llfbandit.app_links'
          version '1.0'
          apply plugin: 'com.android.library'
          android {
          namespace '$NAMESPACE'
          compileSdk 35
          defaultConfig {
          minSdkVersion 21
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          }
          GRADLEEOF

          echo "Patched $GRADLE_FILE:"
          cat "$GRADLE_FILE"

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexagram-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  # ---------------------------------------------------------------------
  # iOS — unsigned .ipa (you sign it yourself afterwards with eSign)
  # ---------------------------------------------------------------------
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Build unsigned iOS app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # flutter build ipa always wants a signing team, which we don't have
      # in CI. So we build the plain .app bundle above and pack it into
      # the Payload/ folder structure that makes a valid, unsigned .ipa
      # by hand — this is the same structure eSign / AltStore expect
      # before you sign it.
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r nexagram-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nexagram-ios-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/nexagram-unsigned.ipa
