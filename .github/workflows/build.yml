name: Build APK & unsigned IPA

# Runs on every push to main, and can also be triggered manually from the
# GitHub app (Actions tab -> this workflow -> "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  # The Flutter project (pubspec.yaml etc.) lives in a subfolder of the
  # repo, not at the repo root — every `run:` step below needs to execute
  # from here, set via `defaults.run.working-directory` on each job.
  PROJECT_DIR: nexagram

jobs:
  # ---------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Java (needed for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      # Several Flutter plugins in this project's dependency tree
      # (app_links 6.4.1, record_android 1.5.2, and potentially others
      # pulled in transitively) ship an android/build.gradle that reads
      # compileSdk/minSdk/targetSdk off a `project.android.flutter.*`
      # property. That property was removed by the Android Gradle
      # Plugin — this project uses AGP 8.7.3 — which is what throws
      # "Could not get unknown property 'flutter' for extension
      # 'android'" / "compileSdkVersion is not specified". Individually
      # bumping each affected plugin's pubspec version isn't an option:
      # the newer releases require a Dart SDK higher than the one
      # Flutter 3.24.5 ships (this workflow is pinned to that Flutter
      # version), so `pub get` itself fails before Gradle ever runs.
      #
      # So instead of patching one hardcoded plugin at a time — finding
      # out about the next broken one only after another failed CI run —
      # this step scans every android/build.gradle in the pub cache,
      # and for any file that still references `project.android.flutter.*`
      # replaces just that file's `android { ... }` block with one that
      # hardcodes the SDK numbers instead. Everything else in the file
      # (dependencies, source sets, custom tasks) is left untouched.
      - name: Patch plugins whose build.gradle references project.android.flutter.*
        run: |
          shopt -s globstar nullglob
          PATCHED=0
          for GRADLE_FILE in "$HOME"/.pub-cache/hosted/pub.dev/*/android/build.gradle; do
            if ! grep -q 'project\.android\.flutter\.' "$GRADLE_FILE"; then
              continue
            fi

            PKG_DIR="$(dirname "$GRADLE_FILE")"
            MANIFEST_FILE="$PKG_DIR/src/main/AndroidManifest.xml"

            echo "=== Found legacy 'project.android.flutter.*' reference in: $GRADLE_FILE ==="
            echo "--- before ---"
            cat "$GRADLE_FILE"

            NAMESPACE=""
            if [ -f "$MANIFEST_FILE" ]; then
              NAMESPACE=$(grep -o 'package="[^"]*"' "$MANIFEST_FILE" | head -1 | sed -e 's/package="//' -e 's/"$//')
            fi
            if [ -z "$NAMESPACE" ]; then
              # Fall back to the Gradle project's own `group` line, which
              # every one of these plugin build.gradle files declares.
              NAMESPACE=$(grep -m1 "^group " "$GRADLE_FILE" | sed -e "s/^group *['\"]//" -e "s/['\"].*$//")
            fi
            if [ -z "$NAMESPACE" ]; then
              echo "Could not determine a namespace for $GRADLE_FILE — skipping (leaving file untouched)."
              continue
            fi
            echo "Using namespace: $NAMESPACE"

            cat > "$GRADLE_FILE" <<GRADLEEOF
          group '$NAMESPACE'
          version '1.0'
          apply plugin: 'com.android.library'
          android {
          namespace '$NAMESPACE'
          compileSdk 35
          defaultConfig {
          minSdkVersion 21
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          }
          GRADLEEOF

            echo "--- after ---"
            cat "$GRADLE_FILE"
            PATCHED=$((PATCHED + 1))
          done

          echo "Patched $PATCHED plugin build.gradle file(s)."

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexagram-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  # ---------------------------------------------------------------------
  # iOS — unsigned .ipa (you sign it yourself afterwards with eSign)
  # ---------------------------------------------------------------------
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Build unsigned iOS app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # flutter build ipa always wants a signing team, which we don't have
      # in CI. So we build the plain .app bundle above and pack it into
      # the Payload/ folder structure that makes a valid, unsigned .ipa
      # by hand — this is the same structure eSign / AltStore expect
      # before you sign it.
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r nexagram-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nexagram-ios-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/nexagram-unsigned.ipa
