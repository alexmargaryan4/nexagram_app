name: Build APK & unsigned IPA

# Runs on every push to main, and can also be triggered manually from the
# GitHub app (Actions tab -> this workflow -> "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  # The Flutter project (pubspec.yaml etc.) lives in a subfolder of the
  # repo, not at the repo root — every `run:` step below needs to execute
  # from here, set via `defaults.run.working-directory` on each job.
  PROJECT_DIR: nexagram

jobs:
  # ---------------------------------------------------------------------
  # Android APK
  # ---------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Java (needed for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      # Some Flutter plugins in this project's dependency tree (app_links
      # 6.4.1 is the one that's actually broken CI so far; record_android
      # and others may follow — this is a known, ongoing issue across the
      # pub.dev plugin ecosystem, not specific to one package) ship an
      # android/build.gradle whose `compileSdk`/`minSdkVersion` read off a
      # `project.android.flutter.*` property that the Flutter Gradle
      # Plugin used to inject into every subproject. Flutter 3.24+ (this
      # workflow is pinned to 3.24.5) no longer does that, which is what
      # throws "Could not get unknown property 'flutter' for extension
      # 'android'" and "compileSdkVersion is not specified". Individually
      # bumping each affected plugin's pubspec version isn't an option:
      # the newer releases require a Dart SDK higher than the one Flutter
      # 3.24.5 ships, so `pub get` itself would fail before Gradle ever
      # runs.
      #
      # Rather than matching the exact wording of whatever legacy property
      # a given plugin happens to read (that's brittle — a different
      # plugin, or a future version of the same one, could phrase it
      # differently and silently slip past a hardcoded regex, exactly
      # what happened before this fix went in), this step scans every
      # android/build.gradle(.kts) in the pub cache and checks the one
      # thing that actually matters: whether the file's compileSdk / or
      # minSdkVersion line (if present) still references the removed
      # `project.android.flutter.*` (or bare `flutter.`) property, or is
      # missing outright. Either way, that line is replaced/inserted with
      # a hardcoded value; every other line in the file — dependencies,
      # source sets, custom tasks — is left completely untouched. This
      # also covers android/build.gradle.kts (Kotlin DSL) files using the
      # equivalent `compileSdk =` / `minSdk =` syntax.
      - name: Patch plugin build.gradle files with a broken/missing compileSdk or minSdkVersion
        run: |
          shopt -s globstar nullglob
          PATCHED=0
          for GRADLE_FILE in "$HOME"/.pub-cache/hosted/pub.dev/*/android/build.gradle "$HOME"/.pub-cache/hosted/pub.dev/*/android/build.gradle.kts; do
            [ -f "$GRADLE_FILE" ] || continue

            # A "broken" reference is a `compileSdk`/`minSdkVersion` (or
            # `minSdk` in the Kotlin DSL) line whose value reads off the
            # removed `project.android.flutter.*` / bare `flutter.*`
            # property — that's the actual bug, independent of the exact
            # property name used. "Missing entirely" is the other broken
            # case (AGP 8+ requires compileSdk explicitly).
            BROKEN_COMPILE_LINE=""
            if grep -Eq 'compileSdk(Version)?[[:space:]=]' "$GRADLE_FILE"; then
              BROKEN_COMPILE_LINE=$(grep -E 'compileSdk(Version)?[[:space:]=]' "$GRADLE_FILE" | grep 'project\.android\.flutter\|[^a-zA-Z]flutter\.' | head -1)
              MISSING_COMPILE=false
            else
              MISSING_COMPILE=true
            fi

            BROKEN_MINSDK_LINE=""
            if grep -Eq 'minSdk(Version)?[[:space:]=]' "$GRADLE_FILE"; then
              BROKEN_MINSDK_LINE=$(grep -E 'minSdk(Version)?[[:space:]=]' "$GRADLE_FILE" | grep 'project\.android\.flutter\|[^a-zA-Z]flutter\.' | head -1)
            fi

            NEEDS_PATCH=false
            [ "$MISSING_COMPILE" = true ] && NEEDS_PATCH=true
            [ -n "$BROKEN_COMPILE_LINE" ] && NEEDS_PATCH=true
            [ -n "$BROKEN_MINSDK_LINE" ] && NEEDS_PATCH=true

            if [ "$NEEDS_PATCH" = false ]; then
              continue
            fi

            # No `android { ... }` block at all — nothing sensible for us
            # to patch, skip rather than risk corrupting the file.
            if ! grep -q 'android[[:space:]]*{' "$GRADLE_FILE"; then
              continue
            fi

            echo "=== Patching: $GRADLE_FILE ==="
            echo "--- before ---"
            cat "$GRADLE_FILE"

            PKG_DIR="$(dirname "$GRADLE_FILE")"
            MANIFEST_FILE="$PKG_DIR/src/main/AndroidManifest.xml"
            IS_KTS=false
            case "$GRADLE_FILE" in
              *.kts) IS_KTS=true ;;
            esac

            if [ "$IS_KTS" = true ]; then
              COMPILE_SDK_LINE='    compileSdk = 35'
              MINSDK_LINE='        minSdk = 21'
              NAMESPACE_LINE_PREFIX='    namespace = '
            else
              COMPILE_SDK_LINE='    compileSdk 35'
              MINSDK_LINE='        minSdkVersion 21'
              NAMESPACE_LINE_PREFIX='    namespace '
            fi

            # Only add a namespace if the file doesn't already declare one
            # (AGP 8+ requires it; older plugin build.gradle files instead
            # relied on a `package="..."` attribute in AndroidManifest.xml,
            # which AGP 8 no longer reads).
            NEEDS_NAMESPACE=true
            if grep -Eq '^\s*namespace[[:space:]=]' "$GRADLE_FILE"; then
              NEEDS_NAMESPACE=false
            fi

            NAMESPACE=""
            if [ "$NEEDS_NAMESPACE" = true ]; then
              if [ -f "$MANIFEST_FILE" ]; then
                NAMESPACE=$(grep -o 'package="[^"]*"' "$MANIFEST_FILE" | head -1 | sed -e 's/package="//' -e 's/"$//')
              fi
              if [ -z "$NAMESPACE" ]; then
                # Fall back to the Gradle project's own `group` line, which
                # these plugin build.gradle files conventionally declare.
                NAMESPACE=$(grep -m1 -E "^\s*group[[:space:]=]" "$GRADLE_FILE" | sed -e "s/^[[:space:]]*group[[:space:]=]*//" -e "s/[\"']//g" -e 's/[[:space:]]*$//')
              fi
              if [ -z "$NAMESPACE" ]; then
                echo "Could not determine a namespace for $GRADLE_FILE — skipping namespace insertion."
                NEEDS_NAMESPACE=false
              fi
            fi

            TMP_FILE="$(mktemp)"
            awk -v broken_compile="$BROKEN_COMPILE_LINE" \
                -v broken_minsdk="$BROKEN_MINSDK_LINE" \
                -v missing_compile="$MISSING_COMPILE" \
                -v compile_line="$COMPILE_SDK_LINE" \
                -v minsdk_line="$MINSDK_LINE" \
                -v add_namespace="$NEEDS_NAMESPACE" \
                -v ns_prefix="$NAMESPACE_LINE_PREFIX" \
                -v ns_value="$NAMESPACE" \
                -v is_kts="$IS_KTS" \
                '
                  BEGIN { ns_inserted = 0; compile_inserted = 0 }
                  {
                    if (broken_compile != "" && $0 == broken_compile) {
                      if (add_namespace == "true" && ns_inserted == 0) {
                        if (is_kts == "true") { print ns_prefix "\"" ns_value "\"" }
                        else { print ns_prefix "'"'"'" ns_value "'"'"'" }
                        ns_inserted = 1
                      }
                      print compile_line
                      compile_inserted = 1
                    } else if (broken_minsdk != "" && $0 == broken_minsdk) {
                      print minsdk_line
                    } else {
                      print
                      if (missing_compile == "true" && compile_inserted == 0 && $0 ~ /android[[:space:]]*\{/) {
                        if (add_namespace == "true" && ns_inserted == 0) {
                          if (is_kts == "true") { print ns_prefix "\"" ns_value "\"" }
                          else { print ns_prefix "'"'"'" ns_value "'"'"'" }
                          ns_inserted = 1
                        }
                        print compile_line
                        compile_inserted = 1
                      }
                    }
                  }
                ' "$GRADLE_FILE" > "$TMP_FILE"

            mv "$TMP_FILE" "$GRADLE_FILE"

            echo "--- after ---"
            cat "$GRADLE_FILE"
            PATCHED=$((PATCHED + 1))
          done

          echo "Patched $PATCHED plugin build.gradle file(s)."

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexagram-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  # ---------------------------------------------------------------------
  # iOS — unsigned .ipa (you sign it yourself afterwards with eSign)
  # ---------------------------------------------------------------------
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - run: flutter pub get

      - name: Build unsigned iOS app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # flutter build ipa always wants a signing team, which we don't have
      # in CI. So we build the plain .app bundle above and pack it into
      # the Payload/ folder structure that makes a valid, unsigned .ipa
      # by hand — this is the same structure eSign / AltStore expect
      # before you sign it.
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r nexagram-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nexagram-ios-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/nexagram-unsigned.ipa
